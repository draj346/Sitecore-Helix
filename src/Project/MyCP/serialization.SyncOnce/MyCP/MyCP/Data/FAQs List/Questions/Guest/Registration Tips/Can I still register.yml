    - ID: "8fe809db-dd54-4589-9dc4-0f9d6a62ee88"
      Hint: Description
      Value: <p>Yes. Policies issued in the state of New York are underwritten by Bankers Conseco Life Insurance Company, and in all other states they are issued by Colonial Penn Life. If you lived in New York when you purchased one policy, and a different state when you purchased another policy, you will need to register twice (using one policy from each company for each registration), and have two separate logins to view information for all of your policies.</p>
    - ID: "9e056eaf-3802-4878-98c8-92f8ec699126"
      Hint: Heading
      Value: "I have a Colonial Penn Life Insurance policy and a Bankers Conseco Life Insurance policy, can I still register?"
