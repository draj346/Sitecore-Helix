    - ID: "8fe809db-dd54-4589-9dc4-0f9d6a62ee88"
      Hint: Description
      Value: |
        <p>The named beneficiary is shown on the original application/enrollment form attached to the policy/certificate, or it may be shown on the policy specification page. If a beneficiary designation was changed, an endorsed copy of the change was returned to the owner with the instruction that it be attached to the appropriate insurance documents. If you are unable to determine the beneficiary, you may request this information by <a href="#" data-bs-target="#collapse-{24574958-654F-4B7F-A66D-11FD0495006B}" class="faq-jumplink">mail</a>, or <a href="/Customer-Service" target="_self">telephone</a>.</p>
