    - ID: "8fe809db-dd54-4589-9dc4-0f9d6a62ee88"
      Hint: Description
      Value: |
        <p>Coverage is considered to be in force, as of the effective date of the policy/certificate, if premium payments are current. Coverage may also be in effect, depending on the specific contract, if premium payments were discontinued and there is cash value sufficient to provide extended term insurance or reduced paid-up insurance under the non-forfeiture option outlined in the policy. Each policy, or certificate, should be reviewed for the specific non-forfeiture provisions. Of course, you may contact us by <a href="#" data-bs-target="#collapse-{24574958-654F-4B7F-A66D-11FD0495006B}" class="faq-jumplink">mail</a>, or <a href="/Customer-Service" target="_self">telephone</a> to verify if coverage is in force. Also, you may simply submit a claim against the policy in question and we will advise you in writing if it is not in force.</p>
    - ID: "9e056eaf-3802-4878-98c8-92f8ec699126"
