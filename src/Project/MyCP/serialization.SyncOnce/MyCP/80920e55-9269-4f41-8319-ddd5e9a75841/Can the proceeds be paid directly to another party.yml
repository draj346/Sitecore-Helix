    - ID: "8fe809db-dd54-4589-9dc4-0f9d6a62ee88"
      Hint: Description
      Value: <p>Life insurance proceeds can be paid directly to a funeral home, cemetery or other entity if the beneficiary executes an assignment of proceeds instrument. Funeral homes and cemeteries typically have their own assignment of proceeds forms. In order for us to honor an assignment of proceeds, the beneficiary's signature must be witnessed by a notary public affirming the identity of the person that signed the assignment. Additionally, all policy/certificate numbers subject to assignment must be written on the assignment and the specific maximum amount to be paid by assignment must be clearly stated.</p>
